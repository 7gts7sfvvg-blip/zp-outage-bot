name: check-outage
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: check-outage
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SUBS_URL: https://zp-outage-buttons.vercel.app/api/subs
          SUBS_SECRET: ${{ secrets.SUBS_SECRET }}
        run: python3 bot.py --once
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "outage-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
